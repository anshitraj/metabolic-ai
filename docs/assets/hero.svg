<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Metabolic AI</title>
  <desc id="d">A breathing green organism beside the words Metabolic AI: intelligence that earns, adapts, survives. A status chip cycles through the four operating states.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#7cf0b4"/>
      <stop offset=".45" stop-color="#12b36e"/>
      <stop offset="1" stop-color="#0a6b44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#12b36e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#12b36e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08110c"/>
      <stop offset="1" stop-color="#0f1c15"/>
    </linearGradient>
    <style>
      .f{font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .breathe{transform-origin:280px 190px;animation:breathe 4.8s ease-in-out infinite}
      .halo{transform-origin:280px 190px;animation:halo 4.8s ease-in-out infinite}
      .orbit{transform-origin:280px 190px;animation:spin 18s linear infinite}
      .orbit2{transform-origin:280px 190px;animation:spin 26s linear infinite reverse}
      .ring{transform-origin:280px 190px;animation:ripple 4.8s ease-out infinite}
      .ring.b{animation-delay:1.6s}.ring.c{animation-delay:3.2s}
      .st{opacity:0;animation:state 16s infinite}
      .s2{animation-delay:4s}.s3{animation-delay:8s}.s4{animation-delay:12s}
      .tick{animation:tick 3s ease-in-out infinite}
      .tick:nth-of-type(2){animation-delay:.5s}.tick:nth-of-type(3){animation-delay:1s}.tick:nth-of-type(4){animation-delay:1.5s}.tick:nth-of-type(5){animation-delay:2s}
      @keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}
      @keyframes halo{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes ripple{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
      @keyframes state{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
      @keyframes tick{0%,100%{opacity:.35}40%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.s1{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <g opacity=".18" stroke="#12b36e" stroke-width="1">
    <path d="M0 300 C200 260 400 340 600 300 S1000 260 1200 300" fill="none"/>
    <path d="M0 320 C220 290 420 360 640 320 S1020 280 1200 330" fill="none"/>
  </g>
  <circle class="halo" cx="280" cy="190" r="150" fill="url(#glow)"/>
  <circle class="ring" cx="280" cy="190" r="90" fill="none" stroke="#12b36e" stroke-width="2"/>
  <circle class="ring b" cx="280" cy="190" r="90" fill="none" stroke="#12b36e" stroke-width="2"/>
  <circle class="ring c" cx="280" cy="190" r="90" fill="none" stroke="#12b36e" stroke-width="2"/>
  <g class="orbit"><circle cx="280" cy="70" r="6" fill="#7cf0b4"/><circle cx="400" cy="190" r="4" fill="#12b36e"/></g>
  <g class="orbit2"><circle cx="170" cy="250" r="5" fill="#6c8cff"/><circle cx="330" cy="310" r="3.5" fill="#f2a93b"/></g>
  <circle class="breathe" cx="280" cy="190" r="78" fill="url(#core)"/>
  <circle class="breathe" cx="262" cy="170" r="16" fill="#d9ffeb" opacity=".35"/>

  <text x="500" y="150" class="f" font-size="64" font-weight="700" fill="#f1f7f2" letter-spacing="-1.5">Metabolic AI</text>
  <text x="502" y="200" class="f" font-size="26" fill="#a9c2b2">Intelligence that <tspan fill="#7cf0b4" font-weight="600">earns</tspan>. <tspan fill="#7cf0b4" font-weight="600">Adapts</tspan>. <tspan fill="#7cf0b4" font-weight="600">Survives</tspan>.</text>
  <text x="502" y="238" class="f" font-size="17" fill="#7d958a">An AI business that prices every answer, pays its own bills and proves its books on NEAR.</text>

  <g transform="translate(502 266)">
    <rect width="300" height="40" rx="20" fill="#0e1a13" stroke="#24382c"/>
    <g class="st s1"><circle cx="22" cy="20" r="6" fill="#12b36e"/><text x="38" y="26" class="m" font-size="15" fill="#7cf0b4">ABUNDANCE · premium models</text></g>
    <g class="st s2"><circle cx="22" cy="20" r="6" fill="#f2a93b"/><text x="38" y="26" class="m" font-size="15" fill="#f6c97c">DEFENSIVE · cheaper models</text></g>
    <g class="st s3"><circle cx="22" cy="20" r="6" fill="#e5534b"/><text x="38" y="26" class="m" font-size="15" fill="#f19a94">SURVIVAL · protect reserve</text></g>
    <g class="st s4"><circle cx="22" cy="20" r="6" fill="#6c8cff"/><text x="38" y="26" class="m" font-size="15" fill="#a9baff">RECOVERY · funded again</text></g>
  </g>
  <g transform="translate(504 340)" class="m" font-size="13" fill="#7cf0b4">
    <text class="tick" x="0">pay</text><text class="tick" x="48">→ price</text><text class="tick" x="122">→ route</text><text class="tick" x="196">→ bill</text><text class="tick" x="256">→ prove</text>
  </g>
</svg>
